server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Hashed build assets: cache forever, never fall back to index.html
    # ^~ so this wins over the extension regex below
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Real files (robots.txt, sitemap.xml, images...): 404 if missing instead of serving the SPA
    location ~* \.(?:txt|xml|json|png|jpe?g|webp|gif|svg|ico|js|css|map|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Homepage: backend injects DB content into the SPA shell for crawlers/link previews.
    # Any backend failure falls back to the plain static index.html.
    location = / {
        proxy_pass http://backend:8000/api/seo/render?path=/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # CLI mode duplicates homepage content: keep it out of search results.
    # rewrite...break (not try_files fallback) so the header survives.
    location /cli {
        rewrite ^ /index.html break;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
    }

    # Static file serving (React)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
