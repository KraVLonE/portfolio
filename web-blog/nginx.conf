server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets: cache forever
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # BLG-38: uploaded images from the shared `blog_media` volume (mounted read-only).
    # Filenames are random UUIDs and never overwritten -> immutable caching is safe.
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        try_files $uri =404;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Defense in depth: even a mis-typed file can't run script from this origin.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Real static files: 404 instead of the SPA shell
    location ~* \.(?:txt|json|png|jpe?g|webp|gif|svg|ico|js|css|map|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BLG-61/62: feeds are generated by the backend.
    location = /rss.xml {
        proxy_pass http://backend:8000/api/blog/rss.xml;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/blog/sitemap.xml;
        proxy_set_header Host $host;
    }

    # The plain shell, fetched by the backend as its SEO template. Never routed to @seo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BLG-60: pages (/, /<slug>) are server-rendered by the backend for crawlers/link previews.
    # Real files are served directly; everything else goes to @seo.
    location / {
        try_files $uri @seo;
    }

    location @seo {
        # rewrite (not proxy_pass with variables) so no DNS resolver is needed; original
        # query args (?tag=, ?page=) are appended automatically.
        rewrite ^ /api/seo/blog?path=$uri break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # 404 (themed shell, noindex) and 301 (renamed slug) pass through; failures fall back to the SPA.
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
